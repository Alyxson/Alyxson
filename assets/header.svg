<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="264" viewBox="0 0 1200 264" role="img" aria-labelledby="title desc">
  <title id="title">Alyxson</title>
  <desc id="desc">Full-stack developer. TypeScript, React, Node.js.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3557"/>
      <stop offset="1" stop-color="#274b78"/>
    </linearGradient>
  </defs>
  <style>
    .back { animation: drift 14s ease-in-out infinite alternate; }
    .mid { animation: drift 10s ease-in-out infinite alternate-reverse; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-120px); } }
    @media (prefers-reduced-motion: reduce) { .back, .mid { animation: none; } }
    .name { font: 800 76px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f1faee; letter-spacing: -1px; }
    .tag { font: 500 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #a8dadc; letter-spacing: .5px; }
  </style>
  <!-- Waves wider than the frame so the drift never shows an edge. -->
  <path class="back" fill="#457b9d" opacity=".55" d="M0 0H1320V214C1210 250 1100 186 990 210S770 262 660 226 440 180 330 212 110 258 0 222Z"/>
  <path class="mid" fill="#2f5d8a" opacity=".8" d="M0 0H1320V196C1200 232 1080 172 960 198S720 246 600 210 360 168 240 196 60 236 0 208Z"/>
  <path fill="url(#sea)" d="M0 0H1200V176C1100 206 1000 160 900 180S700 222 600 192 400 152 300 176 100 214 0 186Z"/>
  <text class="name" x="600" y="104" text-anchor="middle">Alyxson</text>
  <text class="tag" x="600" y="146" text-anchor="middle">Full-stack developer · TypeScript · React · Node.js</text>
</svg>
